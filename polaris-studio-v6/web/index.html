<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Polaris Studio v6</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="app">
    <aside class="rail" id="rail"></aside>
    <div class="workspace">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="eyebrow">RX 590 GME</p>
          <h1 id="top-title">Studio</h1>
        </div>
        <div class="top-actions">
          <button type="button" class="ghost" data-act="palette" title="Ctrl+K">⌘K</button>
          <button type="button" class="ghost" data-act="lang" id="lang-btn">فا</button>
          <span class="pulse" id="gpu-pill">GPU</span>
        </div>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>
  <div id="toasts" class="toasts"></div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
  <noscript><p class="noscript">Polaris Studio needs JavaScript. The API is still at /api/health.</p></noscript>
  <script src="/app.js"></script>
</body>
</html>
